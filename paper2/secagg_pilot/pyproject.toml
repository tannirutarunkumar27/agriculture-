[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "paper2-secagg-pilot"
version = "0.1.0"
description = "Simulation-only SecAgg+ pilot for Paper 2"
license = {file = "LICENSE"}
dependencies = ["flwr>=1.42.0,<1.43.0"]

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.flwr.app]
publisher = "paper2-research"
fab-format-version = 1
flwr-version-target = "1.42.0"

[tool.flwr.app.components]
serverapp = "paper2.secagg_pilot.server_app:app"
clientapp = "paper2.secagg_pilot.client_app:app"

[tool.flwr.app.config]
num-server-rounds = 1
learning-rate = 0.01
features = 54
fold-id = "outer_0"
# Must be replaced with an absolute path by a frozen execution package.
data-root = "UNBOUND"
client-roster = "UNBOUND"


